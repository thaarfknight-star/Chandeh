name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is preinstalled on ubuntu-latest runners (ANDROID_SDK_ROOT)
      - name: Accept SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/NerkhCheck-debug.apk app/build/outputs/apk/debug/NerkhCheck.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NerkhCheck-debug-apk
          path: app/build/outputs/apk/debug/NerkhCheck.apk

  # وقتی تگی مثل v1.0.6 پوش می‌شود: ریلیز گیت‌هاب با APK ضمیمه می‌سازد
  # تا موتور آپدیت داخل برنامه نسخه‌ی جدید را پیدا و دانلود کند.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: NerkhCheck-debug-apk
          path: apk

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # اگر ریلیز از قبل (مثلاً از مرورگر) ساخته شده بود، فقط APK را ضمیمه کن
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/NerkhCheck.apk --clobber
          else
            gh release create "$TAG" apk/NerkhCheck.apk \
              --title "نسخه‌ی $VER" \
              --notes "نسخه‌ی $VER منتشر شد.

          برای به‌روزرسانی، کافی است در برنامه «بررسی آپدیت» را بزنید تا دانلود و نصب داخل خود برنامه انجام شود."
          fi
